name: checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The installer that checks the hashes is pinned too.
          version: "0.13.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
      - name: Install Python and the pinned dev tools
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv --require-hashes -r requirements-dev.txt
      - name: Commit-stage checks
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
      - name: Push-stage checks
        run: .venv/bin/pre-commit run --all-files --hook-stage pre-push

  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and start it
        run: scripts/image_smoke.sh
