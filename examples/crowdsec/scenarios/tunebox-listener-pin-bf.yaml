# Twenty wrong listening PINs (or tries while locked out) from one address
# (for IPv6, one /64) at once, or a steady stream faster than one every 30
# seconds (a leaky bucket of 20 that drains one every 30 s). tunebox
# already locks an address after ten wrong PINs for fifteen minutes; this
# bans the address (or its /64) at the proxy for whoever keeps going.
type: leaky
name: tunebox/listener-pin-bf
description: "Repeated wrong PINs on the tunebox player"
filter: >-
  evt.Meta.client_range != ''
  && evt.Meta.log_type == 'tunebox_listener_pin_failed'
groupby: evt.Meta.client_range
scope:
  type: Range
  expression: evt.Meta.client_range
capacity: 19
leakspeed: 30s
blackhole: 5m
labels:
  service: tunebox
  type: bruteforce
  remediation: true
