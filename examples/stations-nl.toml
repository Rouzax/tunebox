# Every station probed for tunebox: HTTPS streams with CORS and a now-playing
# source. Copy the channels you want into your tunebox.toml. Logos are
# downloaded once by tunebox and served from its data folder.
# Stream bitrates are what the stations reported when this file was made.

[[channels]]
id = "owr"
name = "One World Radio"
group = "Tomorrowland"
logo = "https://i.imgur.com/YEQRKTU.png"
always = true
source = { type = "triton", mount = "OWR_INTERNATIONAL" }

[[channels.streams]]
name = "High"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONAL_ADP.aac"
codec = "aac"
kbps = 256

[[channels.streams]]
name = "Standard"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONALAAC.aac"
codec = "aac"
kbps = 128

[[channels.streams]]
name = "Compatible"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONAL.mp3"
codec = "mp3"
kbps = 192

[channels.rules]
station_id = '^[A-Z]\d{4} \d{2} [A-Za-z]{3} \d{4}\b'
played_by = '\s*\(Played by ([^)]*)\)\s*$'

