# tunebox configuration. Copy to the data directory as tunebox.toml.

[server]
port = 8080
# host = "0.0.0.0"
# data_dir defaults to the directory this file is in.

[defaults]
# Seconds after a track's start time at which it counts as heard. The player
# adds its own buffer on top; PawTunes' stock player does not, so it gets a
# separate, longer delay.
delay_s = 7
pawtunes_delay_s = 28
poll_interval_s = 12
history_size = 50

# [player]
# Day/night "automatic" follows sunrise and sunset here; without it the
# browser's own dark mode setting decides.
# latitude = 52.0
# longitude = 5.0
# default_channel = "owr"

[[channels]]
id = "owr"
name = "One World Radio"
group = "Tomorrowland"
# Pinned: polled even while nobody listens, so its history has no gaps.
always = true
source = { type = "triton", mount = "OWR_INTERNATIONAL" }

[[channels.streams]]
name = "High"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONAL_ADP.aac"
codec = "aac"
kbps = 256

[[channels.streams]]
name = "Standard"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONALAAC.aac"
codec = "aac"
kbps = 128

[[channels.streams]]
name = "Compatible"
url = "https://playerservices.streamtheworld.com/api/livestream-redirect/OWR_INTERNATIONAL.mp3"
codec = "mp3"
kbps = 192

[channels.rules]
station_id = '^[A-Z]\d{4} \d{2} [A-Za-z]{3} \d{4}\b'
played_by = '\s*\(Played by ([^)]*)\)\s*$'

